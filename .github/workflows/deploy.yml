name: Deploy Backend to Hetzner

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            BRANCH="${{ github.ref_name }}"
            echo "🚀 Desplegando Backend desde rama $BRANCH..."
            cd /var/www/lealtix/lealtix-BE
            git checkout $BRANCH
            git pull origin $BRANCH
            cd /var/www/lealtix
            # Fija el signing secret del webhook de Stripe (endpoint api.lealtix.com.mx)
            export STRIPE_WEBHOOK_SECRET="whsec_KzGucdB6wfFN8Y14k7Gl7vxeSwv58o4S"
            docker compose up -d --build lealtix-backend
            echo "✅ Backend actualizado con éxito!"
